<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My orders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff5d73'/%3E%3Cstop offset='1' stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Poppins,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <a class="logo" href="index.html"><span class="logo-mark">E</span>E-shop</a>
  <div class="links">
    <a href="index.html">Shop</a>
    <a href="login.html" data-nav="login">Login</a>
    <a href="orders.html" data-nav="account" style="display:none"></a>
    <a href="cart.html">Cart <span class="cart-count">0</span></a>
  </div>
</nav>

<div class="page-narrow">
  <h1 style="margin-bottom:20px;">My orders</h1>
  <div id="orders-list">Loading...</div>
</div>

<script src="js/api.js"></script>
<script>
if (!getUser()) window.location.href = 'login.html?next=orders.html';

const STATUS_LABEL = {
  processing: 'Processing',
  shipped: 'Shipped',
  out_for_delivery: 'Out for delivery',
  delivered: 'Delivered'
};

async function loadOrders() {
  const el = document.getElementById('orders-list');
  try {
    const orders = await apiRequest('/orders');
    if (!orders.length) {
      el.innerHTML = '<div class="empty-state">No orders yet. <a href="index.html" style="color:#b25a2e; font-weight:600;">Start shopping</a></div>';
      return;
    }
    el.innerHTML = orders.map(o => `
      <div class="order-card" onclick="window.location.href='track-order.html?id=${o._id}'" style="cursor:pointer;">
        <div class="thumb"></div>
        <div class="info">
          <div><strong>Order #${o._id.slice(-6).toUpperCase()}</strong></div>
          <div style="color:#5c5a52; font-size:13px;">Placed ${new Date(o.createdAt).toLocaleDateString()}</div>
        </div>
        <div style="text-align:right;">
          <div class="badge ${o.status}">${STATUS_LABEL[o.status]}</div>
          <div style="margin-top:6px; font-weight:600;">$${o.total.toFixed(2)}</div>
        </div>
      </div>
    `).join('');
  } catch (err) {
    el.innerHTML = `<p>${err.message}</p>`;
  }
}

loadOrders();
</script>
</body>
</html>
