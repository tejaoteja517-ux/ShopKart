<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff5d73'/%3E%3Cstop offset='1' stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Poppins,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <a class="logo" href="index.html"><span class="logo-mark">E</span>ShopKart</a>
  <div class="links"><a href="index.html">Shop</a><a href="cart.html">Cart <span class="cart-count">0</span></a></div>
</nav>

<div class="form-page">
  <h1>Create account</h1>
  <div class="error-msg" id="error"></div>
  <form id="signup-form">
    <label for="name">Full name</label>
    <input type="text" id="name" required>
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" minlength="6" required>
    <button class="btn full" type="submit">Create account</button>
  </form>
  <p class="form-footer">Already have an account? <a href="login.html">Sign in</a></p>
</div>

<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const next = params.get('next') || 'index.html';

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';
  try {
    const data = await apiRequest('/auth/signup', {
      method: 'POST',
      body: JSON.stringify({ name, email, password })
    });
    setToken(data.token);
    setUser(data.user);
    window.location.href = next;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
