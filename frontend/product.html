<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Product Details</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

<div class="logo">

<i class="fa-solid fa-cart-shopping"></i>

<span>ShopKart</span>

</div>

<div class="nav-icons">

<button onclick="location.href='index.html'">

<i class="fa-solid fa-house"></i>

Home

</button>

<button onclick="location.href='cart.html'">

<i class="fa-solid fa-cart-shopping"></i>

Cart

<span id="cart-count">0</span>

</button>

</div>

</header>

<!-- ================= PRODUCT ================= -->

<section class="product-container">

<div class="product-image-section">

<img

id="product-image"

class="detail-image"

src=""

alt="Product">

</div>

<div class="product-details">

<h1 id="product-name"></h1>

<p class="category"

id="product-category">

</p>

<div class="rating">

⭐ <span id="product-rating"></span>

&nbsp;

(<span id="product-reviews"></span> Reviews)

</div>

<h2 class="price"

id="product-price">

</h2>

<p

id="product-description"

class="description">

</p>

<div class="quantity-box">

<button

onclick="decreaseQty()">

-

</button>

<input

type="number"

id="qty"

value="1"

min="1">

<button

onclick="increaseQty()">

+

</button>

</div>

<div class="action-buttons">

<button

class="cart-btn"

onclick="addToCart()">

<i class="fa fa-cart-shopping"></i>

Add to Cart

</button>

<button

class="wishlist-btn"

onclick="addWishlist()">

<i class="fa-regular fa-heart"></i>

Wishlist

</button>

</div>

</div>

</section>

<!-- JavaScript will be added in Part 2 -->
 <script>

const API = "/api/products";

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

let product = null;

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

async function loadProduct(){

    try{

        const res = await fetch(API);

        const products = await res.json();

        product = products.find(p=>p._id===id);

        if(!product){

            document.body.innerHTML="<h1 style='text-align:center;margin-top:100px'>Product Not Found</h1>";

            return;

        }

        document.getElementById("product-image").src = product.image;

        document.getElementById("product-name").innerText = product.name;

        document.getElementById("product-category").innerText = product.category;

        document.getElementById("product-rating").innerText = product.rating;

        document.getElementById("product-reviews").innerText = product.reviews;

        document.getElementById("product-price").innerText =
            "₹"+Number(product.price).toLocaleString("en-IN");

        document.getElementById("product-description").innerText =
            product.description;

        document.getElementById("cart-count").innerText = cart.length;

    }

    catch(err){

        console.log(err);

    }

}

function increaseQty(){

    const qty=document.getElementById("qty");

    qty.value=parseInt(qty.value)+1;

}

function decreaseQty(){

    const qty=document.getElementById("qty");

    if(parseInt(qty.value)>1){

        qty.value=parseInt(qty.value)-1;

    }

}

function addToCart(){

    const qty=parseInt(document.getElementById("qty").value);

    for(let i=0;i<qty;i++){

        cart.push(product._id);

    }

    localStorage.setItem("cart",JSON.stringify(cart));

    document.getElementById("cart-count").innerText=cart.length;

    alert("Product Added to Cart");

}

function addWishlist(){

    if(!wishlist.includes(product._id)){

        wishlist.push(product._id);

        localStorage.setItem("wishlist",JSON.stringify(wishlist));

        alert("Added to Wishlist");

    }else{

        alert("Already in Wishlist");

    }

}

window.onload=loadProduct;

</script>

</body>

</html>
